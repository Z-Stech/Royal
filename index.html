
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#17152e">

<title>TaskQuest V2</title>

<style>
:root {
  --purple: #7657f5;
  --dark: #17152e;
  --bg: #f5f3ff;
  --white: #ffffff;
  --muted: #88849b;
  --green: #22c55e;
  --orange: #f97316;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: var(--bg);
  color: #25233a;
}

button, input {
  font: inherit;
}

button {
  cursor: pointer;
}

.header {
  background: linear-gradient(135deg, #5b43db, #9275ff);
  color: white;
  padding: 25px 20px 30px;
  border-radius: 0 0 28px 28px;
}

.header-inner, .container {
  max-width: 650px;
  margin: auto;
}

.topline {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.topline h1 {
  margin: 0;
  font-size: 27px;
}

.subtitle {
  margin: 8px 0 20px;
  opacity: .9;
}

.stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 9px;
}

.stat {
  background: rgba(255,255,255,.17);
  border: 1px solid rgba(255,255,255,.15);
  padding: 13px 5px;
  text-align: center;
  border-radius: 14px;
}

.stat strong {
  display: block;
  font-size: 23px;
  margin-bottom: 5px;
}

.stat span {
  font-size: 12px;
}

.level-box {
  margin-top: 20px;
}

.level-line {
  display: flex;
  justify-content: space-between;
  font-size: 13px;
  margin-bottom: 8px;
}

.progress {
  height: 10px;
  border-radius: 20px;
  background: rgba(255,255,255,.25);
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  width: 0%;
  background: #ffe66d;
  transition: width .3s;
}

.container {
  padding: 20px 16px 50px;
}

.section-title {
  font-size: 19px;
  margin: 24px 0 13px;
}

.add-box {
  display: flex;
  gap: 9px;
}

.add-box input {
  min-width: 0;
  flex: 1;
  padding: 15px;
  border: 1px solid #e7e3f4;
  border-radius: 13px;
  outline: none;
  background: white;
}

.add-box input:focus {
  border-color: var(--purple);
}

.primary-btn {
  border: 0;
  background: var(--purple);
  color: white;
  border-radius: 13px;
  padding: 0 19px;
  font-weight: bold;
}

.primary-btn:active, .small-btn:active {
  transform: scale(.97);
}

.streak-card {
  background: white;
  border-radius: 18px;
  padding: 18px;
  box-shadow: 0 4px 15px #29204d0d;
  display: flex;
  align-items: center;
  gap: 16px;
}

.streak-icon {
  font-size: 40px;
}

.streak-card h2 {
  margin: 0 0 5px;
  font-size: 22px;
}

.streak-card p {
  color: var(--muted);
  margin: 0;
  font-size: 13px;
}

.task {
  background: white;
  padding: 15px;
  border-radius: 14px;
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 12px;
  box-shadow: 0 3px 12px #29204d0a;
}

.task input {
  width: 21px;
  height: 21px;
  accent-color: var(--purple);
  flex-shrink: 0;
}

.task-name {
  flex: 1;
  min-width: 0;
  overflow-wrap: anywhere;
}

.task.done .task-name {
  text-decoration: line-through;
  color: #aaa;
}

.delete-btn {
  border: 0;
  background: #fff0f0;
  color: #dc4545;
  border-radius: 9px;
  padding: 9px;
}

.empty {
  text-align: center;
  padding: 30px 10px;
  color: var(--muted);
  background: white;
  border-radius: 15px;
}

.reward-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
}

.reward {
  background: white;
  text-align: center;
  border-radius: 14px;
  padding: 15px 5px;
  border: 2px solid transparent;
}

.reward.unlocked {
  border-color: #a78bfa;
  background: #f4efff;
}

.reward .emoji {
  font-size: 28px;
}

.reward strong {
  display: block;
  margin: 7px 0 4px;
  font-size: 13px;
}

.reward small {
  color: var(--muted);
  font-size: 11px;
}

.reward-status {
  display: block;
  margin-top: 8px;
  color: var(--purple);
  font-size: 11px;
  font-weight: bold;
}

.notice {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translate(-50%, 100px);
  opacity: 0;
  background: var(--dark);
  color: white;
  padding: 14px 20px;
  border-radius: 14px;
  text-align: center;
  width: max-content;
  max-width: 90%;
  transition: .3s;
  z-index: 10;
}

.notice.show {
  transform: translate(-50%, 0);
  opacity: 1;
}

.footer {
  text-align: center;
  color: var(--muted);
  font-size: 12px;
  padding: 20px 0;
}

@media (max-width: 380px) {
  .topline h1 { font-size: 23px; }
  .stat strong { font-size: 19px; }
  .reward { padding: 12px 3px; }
}
</style>
</head>

<body>

<header class="header">
  <div class="header-inner">

    <div class="topline">
      <h1>🎯 TaskQuest</h1>
      <span>V2.0</span>
    </div>

    <p class="subtitle">
      Complete tasks. Earn XP. Build your streak.
    </p>

    <div class="stats">
      <div class="stat">
        <strong id="totalTasks">0</strong>
        <span>📋 Total</span>
      </div>

      <div class="stat">
        <strong id="completedTasks">0</strong>
        <span>✅ Completed</span>
      </div>

      <div class="stat">
        <strong id="coins">0</strong>
        <span>🪙 Coins</span>
      </div>
    </div>

    <div class="level-box">
      <div class="level-line">
        <span>⭐ Level <b id="level">1</b></span>
        <span id="xpText">0 / 100 XP</span>
      </div>

      <div class="progress">
        <div class="progress-fill" id="progressBar"></div>
      </div>
    </div>

  </div>
</header>

<main class="container">

  <h2 class="section-title">🔥 Your Daily Streak</h2>

  <section class="streak-card">
    <div class="streak-icon">🔥</div>
    <div>
      <h2><span id="streak">0</span> Days</h2>
      <p id="streakMessage">Complete a task today to begin!</p>
    </div>
  </section>

  <h2 class="section-title">➕ Add a New Task</h2>

  <form class="add-box" id="taskForm">
    <input
      id="taskInput"
      type="text"
      maxlength="120"
      placeholder="What do you need to do?"
      required
    >
    <button class="primary-btn" type="submit">Add +</button>
  </form>

  <h2 class="section-title">📋 My Tasks</h2>

  <div id="taskList"></div>

  <h2 class="section-title">🏆 Achievements</h2>

  <div class="reward-grid" id="rewardGrid"></div>

  <div class="footer">
    TaskQuest V2 • Your progress is saved on this device.
  </div>

</main>

<div class="notice" id="notice" role="status"></div>

<script>
"use strict";

const STORAGE_KEY = "taskquest_v2_data";

const defaultData = {
  tasks: [],
  xp: 0,
  coins: 0,
  activityDates: [],
  achievements: []
};

let data = loadData();

const milestones = [
  {
    id: "first",
    days: 1,
    emoji: "🌱",
    name: "First Step",
    description: "Complete your first task",
    coins: 10
  },
  {
    id: "three",
    days: 3,
    emoji: "🔥",
    name: "On Fire",
    description: "Reach a 3-day streak",
    coins: 25
  },
  {
    id: "seven",
    days: 7,
    emoji: "⭐",
    name: "Weekly Hero",
    description: "Reach a 7-day streak",
    coins: 50
  },
  {
    id: "thirty",
    days: 30,
    emoji: "👑",
    name: "Consistency King",
    description: "Reach a 30-day streak",
    coins: 150
  }
];

function loadData() {
  try {
    const saved = JSON.parse(
      localStorage.getItem(STORAGE_KEY)
    );

    if (!saved || typeof saved !== "object") {
      return { ...defaultData };
    }

    return {
      ...defaultData,
      ...saved,
      tasks: Array.isArray(saved.tasks) ? saved.tasks : [],
      activityDates: Array.isArray(saved.activityDates)
        ? saved.activityDates : [],
      achievements: Array.isArray(saved.achievements)
        ? saved.achievements : [],
      xp: Math.max(0, Number(saved.xp) || 0),
      coins: Math.max(0, Number(saved.coins) || 0)
    };
  } catch (error) {
    return { ...defaultData };
  }
}

function saveData() {
  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(data)
  );
}

function dateKey(date = new Date()) {
  const year = date.getFullYear();
  const month = String(date.getMonth() + 1).padStart(2, "0");
  const day = String(date.getDate()).padStart(2, "0");

  return `${year}-${month}-${day}`;
}

function shiftDate(key, amount) {
  const [year, month, day] = key.split("-").map(Number);
  const date = new Date(year, month - 1, day);
  date.setDate(date.getDate() + amount);
  return dateKey(date);
}

function calculateStreak() {
  const dates = [...new Set(data.activityDates)].sort();

  if (dates.length === 0) return 0;

  const today = dateKey();
  const yesterday = shiftDate(today, -1);
  const latest = dates[dates.length - 1];

  // A missed full calendar day ends the active streak.
  if (latest !== today && latest !== yesterday) {
    return 0;
  }

  let streak = 1;
  let expected = latest;

  for (let i = dates.length - 2; i >= 0; i--) {
    expected = shiftDate(expected, -1);

    if (dates[i] === expected) {
      streak++;
    } else {
      break;
    }
  }

  return streak;
}

function showNotice(message) {
  const notice = document.getElementById("notice");

  notice.textContent = message;
  notice.classList.add("show");

  setTimeout(() => {
    notice.classList.remove("show");
  }, 2600);
}

function checkAchievements() {
  const streak = calculateStreak();

  milestones.forEach(item => {
    const unlocked =
      item.id === "first"
        ? data.tasks.some(task => task.completed)
        : streak >= item.days;

    if (
      unlocked &&
      !data.achievements.includes(item.id)
    ) {
      data.achievements.push(item.id);
      data.coins += item.coins;

      showNotice(
        `🏆 Achievement unlocked: ${item.name}! +${item.coins} coins`
      );
    }
  });
}

function addTask(event) {
  event.preventDefault();

  const input = document.getElementById("taskInput");
  const name = input.value.trim();

  if (!name) return;

  data.tasks.unshift({
    id: crypto.randomUUID
      ? crypto.randomUUID()
      : String(Date.now()) + Math.random(),
    name,
    completed: false
  });

  input.value = "";

  saveData();
  render();

  showNotice("🎯 New task added!");
}

function completeTask(id, checked) {
  const task = data.tasks.find(item => item.id === id);

  if (!task || task.completed === checked) return;

  task.completed = checked;

  if (checked) {
    data.xp += 10;

    const today = dateKey();

    if (!data.activityDates.includes(today)) {
      data.activityDates.push(today);
    }

    showNotice("✨ Task completed! +10 XP");
  } else {
    data.xp = Math.max(0, data.xp - 10);
  }

  checkAchievements();
  saveData();
  render();
}

function deleteTask(id) {
  data.tasks = data.tasks.filter(task => task.id !== id);

  saveData();
  render();

  showNotice("Task deleted.");
}

function renderTasks() {
  const list = document.getElementById("taskList");
  list.replaceChildren();

  if (data.tasks.length === 0) {
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.textContent = "🎯 No tasks yet. Add your first task!";
    list.appendChild(empty);
    return;
  }

  data.tasks.forEach(task => {
    const row = document.createElement("div");
    row.className = "task" + (task.completed ? " done" : "");

    const checkbox = document.createElement("input");
    checkbox.type = "checkbox";
    checkbox.checked = task.completed;
    checkbox.setAttribute("aria-label", "Complete task");

    checkbox.addEventListener("change", () => {
      completeTask(task.id, checkbox.checked);
    });

    const name = document.createElement("span");
    name.className = "task-name";
    name.textContent = task.name;

    const deleteButton = document.createElement("button");
    deleteButton.className = "delete-btn";
    deleteButton.type = "button";
    deleteButton.textContent = "🗑️";
    deleteButton.setAttribute("aria-label", "Delete task");

    deleteButton.addEventListener("click", () => {
      deleteTask(task.id);
    });

    row.append(checkbox, name, deleteButton);
    list.appendChild(row);
  });
}

function renderAchievements() {
  const grid = document.getElementById("rewardGrid");
  grid.replaceChildren();

  milestones.forEach(item => {
    const unlocked = data.achievements.includes(item.id);

    const card = document.createElement("div");
    card.className = "reward" + (unlocked ? " unlocked" : "");

    const emoji = document.createElement("div");
    emoji.className = "emoji";
    emoji.textContent = item.emoji;

    const name = document.createElement("strong");
    name.textContent = item.name;

    const description = document.createElement("small");
    description.textContent = item.description;

    const status = document.createElement("span");
    status.className = "reward-status";
    status.textContent = unlocked
      ? `✓ Unlocked • +${item.coins} coins`
      : `🔒 Reward: ${item.coins} coins`;

    card.append(emoji, name, description, status);
    grid.appendChild(card);
  });
}

function render() {
  const completed = data.tasks.filter(
    task => task.completed
  ).length;

  const level = Math.floor(data.xp / 100) + 1;
  const progress = data.xp % 100;
  const streak = calculateStreak();

  document.getElementById("totalTasks").textContent =
    data.tasks.length;

  document.getElementById("completedTasks").textContent =
    completed;

  document.getElementById("coins").textContent =
    data.coins;

  document.getElementById("level").textContent =
    level;

  document.getElementById("xpText").textContent =
    `${progress} / 100 XP`;

  document.getElementById("progressBar").style.width =
    progress + "%";

  document.getElementById("streak").textContent =
    streak;

  document.getElementById("streakMessage").textContent =
    streak > 0
      ? "Amazing! Keep your daily streak alive."
      : "Complete a task today to begin your streak!";

  renderTasks();
  renderAchievements();
}

document
  .getElementById("taskForm")
  .addEventListener("submit", addTask);

render();
</script>

</body>
</html>
